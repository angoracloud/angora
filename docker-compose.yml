version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: angora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-angora}
      POSTGRES_USER: ${POSTGRES_USER:-angora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-angora}
    volumes:
      - angora-postgres-data:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - angora-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-angora} -d ${POSTGRES_DB:-angora}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: angora-backend
    environment:
      # postgres:5432 is the internal Docker network address — always fixed,
      # regardless of what POSTGRES_PORT maps to on the host.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-angora}
      DB_USER: ${POSTGRES_USER:-angora}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-angora}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-123456789012345678}
      # Must match the discord-bot service's value: the backend stores this
      # token's hash at startup and the bot presents the token itself.
      SERVICE_TOKEN_DISCORD_BOT: ${SERVICE_TOKEN_DISCORD_BOT:-dev-discord-bot-token}
      # Session cookies are sent over plain HTTP in local dev; a real deployment
      # terminates TLS in front of this and must set COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Empty by default: nginx serves the frontend same-origin, and `pnpm dev`
      # proxies /api through Vite, so no cross-origin request needs allowing.
      # Deliberately has no fallback origin — the session cookie makes requests
      # credentialed, so a default would grant one everywhere it isn't overridden.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # --- Infisical (see .env.example) ---
      # Off by default, so this service keeps reading plain env vars. Turned on,
      # it resolves its own secrets at startup and refuses to boot if it can't
      # reach Infisical. Postgres can't read these — it's a third-party image,
      # so its password comes from compose interpolation; see
      # scripts/infisical-env.ts.
      INFISICAL_ENABLED: ${INFISICAL_ENABLED:-false}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-https://app.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    networks:
      - angora-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: angora-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    networks:
      - angora-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  slack-bot:
    build:
      context: .
      dockerfile: apps/bots/slack/Dockerfile
    container_name: angora-slack-bot
    environment:
      # --- Infisical (see .env.example) ---
      # Off by default, so this service keeps reading plain env vars. Turned on,
      # it resolves its own secrets at startup and refuses to boot if it can't
      # reach Infisical. Postgres can't read these — it's a third-party image,
      # so its password comes from compose interpolation; see
      # scripts/infisical-env.ts.
      INFISICAL_ENABLED: ${INFISICAL_ENABLED:-false}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-https://app.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - angora-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3002/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  discord-bot:
    build:
      context: .
      dockerfile: apps/bots/discord/Dockerfile
    container_name: angora-discord-bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-YOUR_DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-123456789012345678}
      BACKEND_URL: http://backend:8080
      # Must match the backend service's value above.
      SERVICE_TOKEN_DISCORD_BOT: ${SERVICE_TOKEN_DISCORD_BOT:-dev-discord-bot-token}
      # --- Infisical (see .env.example) ---
      # Off by default, so this service keeps reading plain env vars. Turned on,
      # it resolves its own secrets at startup and refuses to boot if it can't
      # reach Infisical. Postgres can't read these — it's a third-party image,
      # so its password comes from compose interpolation; see
      # scripts/infisical-env.ts.
      INFISICAL_ENABLED: ${INFISICAL_ENABLED:-false}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-https://app.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - angora-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  email-bot:
    build:
      context: .
      dockerfile: apps/bots/email/Dockerfile
    container_name: angora-email-bot
    environment:
      # --- Infisical (see .env.example) ---
      # Off by default, so this service keeps reading plain env vars. Turned on,
      # it resolves its own secrets at startup and refuses to boot if it can't
      # reach Infisical. Postgres can't read these — it's a third-party image,
      # so its password comes from compose interpolation; see
      # scripts/infisical-env.ts.
      INFISICAL_ENABLED: ${INFISICAL_ENABLED:-false}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-https://app.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - angora-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3003/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  angora-postgres-data:

networks:
  angora-network:
    driver: bridge
